name: Build Debug APK v3.2.0

on:
  workflow_dispatch:
  push:
    branches: [ v3-build ]   # only triggers on this branch, so it won't clash with your main workflow

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout v3.2.0 tag (from upstream repo)
        uses: actions/checkout@v4
        with:
          repository: DevEmperor/DictateKeyboard
          ref: v3.2.0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dictate-keyboard-v3.2.0-debug-apk
          path: app/build/outputs/apk/debug/*.apk
