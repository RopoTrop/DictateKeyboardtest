name: Build Debug APK v3.2.0

on:
  workflow_dispatch:
  push:
    branches: [ v3-build ]   # only triggers on this branch, so it won't clash with your main workflow

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout v3.2.0 tag (from upstream repo)
        uses: actions/checkout@v4
        with:
          repository: DevEmperor/DictateKeyboard
          ref: v3.2.0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Add placeholder google-services.json
        # v3.2.0 wires in Firebase Crashlytics for crash reporting, which needs a
        # google-services.json tied to a real Firebase project. Since it's only used
        # in error-handling paths (not core app functionality), a syntactically valid
        # placeholder is enough to satisfy the build-time plugin - crash reports just
        # won't actually go anywhere, which is fine for a local test build.
        run: |
          cat > app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "dummy-project",
              "storage_bucket": "dummy-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "net.devemperor.dictate"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  { "current_key": "AIzaSyDUMMYKEYDUMMYKEYDUMMYKEYDUMMYK12" }
                ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dictate-keyboard-v3.2.0-debug-apk
          path: app/build/outputs/apk/debug/*.apk
